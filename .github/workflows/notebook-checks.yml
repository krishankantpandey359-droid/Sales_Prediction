name: Sales prediction notebook checks

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib seaborn scikit-learn jupyter nbconvert
      - name: Execute complete notebook
        run: |
          jupyter nbconvert --to notebook --execute "CodeAlpha_Sales_Prediction_(2).ipynb" --output executed_sales_prediction.ipynb --ExecutePreprocessor.timeout=600
      - name: Verify executed notebook outputs
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path

          notebook = nbformat.read(Path("executed_sales_prediction.ipynb"), as_version=4)
          code_cells = [cell for cell in notebook.cells if cell.cell_type == "code"]
          assert code_cells, "No code cells were executed"
          assert all(cell.execution_count is not None for cell in code_cells if cell.source.strip()), "A non-empty code cell was not executed"
          errors = [
              (index, output.ename, output.evalue)
              for index, cell in enumerate(notebook.cells)
              if cell.cell_type == "code"
              for output in cell.get("outputs", [])
              if output.output_type == "error"
          ]
          assert not errors, f"Notebook execution errors: {errors}"
          assert any(
              output.output_type in {"display_data", "execute_result"}
              for cell in code_cells
              for output in cell.get("outputs", [])
          ), "Notebook did not produce any display outputs"
          print(f"Executed {len(code_cells)} code cells; no notebook errors found.")
          PY
